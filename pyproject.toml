[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shadow"
version = "0.0.0"
description = "Deterministic quantitative research laboratory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets~=15.0",
]

[project.scripts]
shadow-live-data = "shadow.application.live_shadow:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
